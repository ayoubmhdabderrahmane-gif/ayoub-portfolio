<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Clinic Flow | Demo</title><style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#17243a;--ink:#edf4ff;--muted:#9eafc6;--line:#263852;--blue:#3987ff;--cyan:#55d6e8;--green:#4dd4a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#09101c;border-left:1px solid var(--line);padding:24px 18px}.logo{font-weight:bold;font-size:18px;letter-spacing:.5px}.logo b{color:var(--cyan)}.side small{color:var(--muted);display:block;margin:4px 0 28px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:var(--muted);text-align:right;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#1a2b45;color:white}.back{display:block;margin-top:30px;color:var(--cyan);text-decoration:none;font-size:12px}.main{padding:28px clamp(16px,4vw,48px);max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}.top h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--cyan);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:25px;display:block;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;min-width:130px}.btn{background:var(--blue);color:white;border:0;border-radius:8px;padding:9px 14px}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:right;padding:12px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:normal}.status{color:var(--green)}.rowitem{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.rowitem:last-child{border:0}.tag{font-size:11px;color:var(--cyan);background:#1b3551;padding:4px 8px;border-radius:6px}.empty{color:var(--muted);padding:22px;text-align:center}.notice{margin-top:18px;color:var(--muted);font-size:11px}.mobilehead{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.side small{display:none}.nav{display:flex;gap:3px}.nav button{font-size:11px;padding:7px}.back{display:none}.main{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top h1{font-size:21px}}@media(max-width:430px){.nav button{font-size:10px;padding:6px}.stat strong{font-size:21px}table{font-size:10px}th,td{padding:9px 4px}}
</style></head><body><div class="layout"><aside class="side"><div><div class="logo"><b>●</b> CLINIC FLOW</div><small>Interactive concept demo</small><nav class="nav" id="nav"><button class="active" data-tab="0">لوحة العيادة</button><button class="" data-tab="1">المواعيد</button><button class="" data-tab="2">المرضى</button></nav></div><a class="back" href="../index.html">← العودة إلى البورتفوليو</a></aside><main class="main"><header class="top"><div><div class="sub">مساحة تجريبية تفاعلية · بيانات افتراضية</div><h1 id="heading">إدارة العيادة</h1></div><span class="pill">DEMO MODE</span></header><section class="stats" id="stats"></section><section class="grid"><div class="card"><h2 id="listTitle">جدول المواعيد</h2><div class="toolbar" id="toolbar"></div><div id="list"></div></div><div class="card"><h2 id="sideTitle">إضافة موعد</h2><div id="sideContent"></div></div></section><p class="notice">هذا نموذج واجهة تجريبي ببيانات وهمية، وليس نظاماً إنتاجياً ولا يتصل بقاعدة بيانات.</p></main></div><script>
let appointments=[["09:00","ليلى مراد","فحص عام","تم التأكيد"],["10:30","أمين بوزيان","متابعة","في الانتظار"],["11:15","سارة قادري","استشارة","تم التأكيد"],["13:00","يوسف بن علي","فحص عام","تم التأكيد"]];function render(){stats.innerHTML=[["مواعيد اليوم","18"],["مرضى مسجلون","1,284"],["بانتظار التأكيد","3"],["نسبة الحضور","92%"]].map(stat).join("");toolbar.innerHTML='<input id="search" placeholder="ابحث عن مريض..."><button class="btn" id="add">+ موعد جديد</button>';list.innerHTML='<table><thead><tr><th>الوقت</th><th>المريض</th><th>نوع الزيارة</th><th>الحالة</th></tr></thead><tbody>'+appointments.map(a=>'<tr><td>'+a[0]+'</td><td>'+a[1]+'</td><td>'+a[2]+'</td><td class="status">'+a[3]+'</td></tr>').join('')+'</tbody></table>';sideContent.innerHTML='<div class="sub">إضافة موعد تجريبي</div><p><input id="patient" placeholder="اسم المريض" style="width:100%;margin:8px 0"></p><p><input id="time" type="time" value="14:00" style="width:100%"></p><p><select id="type" style="width:100%;background:var(--panel2);color:white;padding:10px;border:1px solid var(--line);border-radius:8px"><option>فحص عام</option><option>متابعة</option><option>استشارة</option></select></p><button class="btn" id="save">حفظ الموعد</button><p class="notice">يمكنك إضافة موعد وسيظهر مباشرة في الجدول.</p>';document.getElementById('add').onclick=()=>document.getElementById('patient').focus();document.getElementById('save').onclick=()=>{let n=document.getElementById('patient').value;if(!n)return alert('أدخل اسم المريض');appointments.push([document.getElementById('time').value,n,document.getElementById('type').value,'تم التأكيد']);render()};document.getElementById('search').oninput=e=>[...list.querySelectorAll('tbody tr')].forEach(r=>r.hidden=!r.textContent.includes(e.target.value))}function stat(x){return '<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>'}const stats=document.getElementById('stats'),toolbar=document.getElementById('toolbar'),list=document.getElementById('list'),sideContent=document.getElementById('sideContent');render();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const i=+b.dataset.tab;document.getElementById('heading').textContent=["لوحة العيادة","المواعيد","المرضى"][i];document.getElementById('listTitle').textContent=["لوحة العيادة","المواعيد","المرضى"][i];});</script></body></html>
