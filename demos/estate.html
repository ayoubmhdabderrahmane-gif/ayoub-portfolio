<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Estate Hub | Demo</title><style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#17243a;--ink:#edf4ff;--muted:#9eafc6;--line:#263852;--blue:#3987ff;--cyan:#55d6e8;--green:#4dd4a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#09101c;border-left:1px solid var(--line);padding:24px 18px}.logo{font-weight:bold;font-size:18px;letter-spacing:.5px}.logo b{color:var(--cyan)}.side small{color:var(--muted);display:block;margin:4px 0 28px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:var(--muted);text-align:right;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#1a2b45;color:white}.back{display:block;margin-top:30px;color:var(--cyan);text-decoration:none;font-size:12px}.main{padding:28px clamp(16px,4vw,48px);max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}.top h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--cyan);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font-size:25px;display:block;margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;min-width:130px}.btn{background:var(--blue);color:white;border:0;border-radius:8px;padding:9px 14px}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:right;padding:12px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:normal}.status{color:var(--green)}.rowitem{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.rowitem:last-child{border:0}.tag{font-size:11px;color:var(--cyan);background:#1b3551;padding:4px 8px;border-radius:6px}.empty{color:var(--muted);padding:22px;text-align:center}.notice{margin-top:18px;color:var(--muted);font-size:11px}.mobilehead{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.side small{display:none}.nav{display:flex;gap:3px}.nav button{font-size:11px;padding:7px}.back{display:none}.main{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top h1{font-size:21px}}@media(max-width:430px){.nav button{font-size:10px;padding:6px}.stat strong{font-size:21px}table{font-size:10px}th,td{padding:9px 4px}}
</style></head><body><div class="layout"><aside class="side"><div><div class="logo"><b>●</b> ESTATE HUB</div><small>Interactive concept demo</small><nav class="nav" id="nav"><button class="active" data-tab="0">نظرة عامة</button><button class="" data-tab="1">العقارات</button><button class="" data-tab="2">العملاء</button></nav></div><a class="back" href="../index.html">← العودة إلى البورتفوليو</a></aside><main class="main"><header class="top"><div><div class="sub">مساحة تجريبية تفاعلية · بيانات افتراضية</div><h1 id="heading">إدارة الوكالة العقارية</h1></div><span class="pill">DEMO MODE</span></header><section class="stats" id="stats"></section><section class="grid"><div class="card"><h2 id="listTitle">العقارات المتاحة</h2><div class="toolbar" id="toolbar"></div><div id="list"></div></div><div class="card"><h2 id="sideTitle">أحدث الاستفسارات</h2><div id="sideContent"></div></div></section><p class="notice">هذا نموذج واجهة تجريبي ببيانات وهمية، وليس نظاماً إنتاجياً ولا يتصل بقاعدة بيانات.</p></main></div><script>
const homes=[{n:"شقة عصرية – منصورة",type:"شقة",price:14500000,rooms:3,area:92},{n:"فيلا عائلية – كانستال",type:"فيلا",price:38000000,rooms:5,area:210},{n:"شقة وسط المدينة",type:"شقة",price:9800000,rooms:2,area:74},{n:"محل تجاري – وسط تلمسان",type:"تجاري",price:12500000,rooms:1,area:65}];function render(){stats.innerHTML=[["عقارات منشورة","36"],["استفسارات جديدة","12"],["زيارات هذا الأسبوع","9"],["صفقات قيد المتابعة","5"]].map(stat).join("");toolbar.innerHTML='<input id="search" placeholder="ابحث حسب المنطقة..."><select id="filter"><option value="">كل الأنواع</option><option>شقة</option><option>فيلا</option><option>تجاري</option></select>';list.innerHTML=homes.map((h,i)=>'<div class="rowitem"><div><b>'+h.n+'</b><div class="sub">'+h.type+' · '+h.rooms+' غرف · '+h.area+' م²</div></div><div><b>'+h.price.toLocaleString('en')+' دج</b><div class="sub">'+(saved.has(i)?'★ محفوظ':'')+'</div></div><button class="btn secondary" data-save="'+i+'">'+(saved.has(i)?'إلغاء الحفظ':'حفظ')+'</button></div>').join('');sideContent.innerHTML='<h2>استفسار عن عقار</h2><input id="client" placeholder="اسم العميل" style="width:100%;margin:8px 0"><select id="interest" style="width:100%;background:var(--panel2);color:white;padding:10px;border:1px solid var(--line);border-radius:8px"><option>شقة عصرية – منصورة</option><option>فيلا عائلية – كانستال</option><option>شقة وسط المدينة</option></select><button class="btn" id="lead" style="margin-top:12px">تسجيل الاستفسار</button><p id="msg" class="notice">احفظ العقارات أو سجّل استفساراً تجريبياً.</p>';document.getElementById('search').oninput=filter;document.getElementById('filter').onchange=filter;document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let i=+b.dataset.save;saved.has(i)?saved.delete(i):saved.add(i);render()});document.getElementById('lead').onclick=()=>{let n=document.getElementById('client').value;if(!n)return alert('أدخل اسم العميل');document.getElementById('msg').textContent='تم تسجيل استفسار '+n+' حول '+document.getElementById('interest').value+' (تجريبي).'}}function filter(){let q=document.getElementById('search').value,t=document.getElementById('filter').value;[...list.children].forEach((r,i)=>r.hidden=!(homes[i].n.includes(q)&&(!t||homes[i].type===t)))}function stat(x){return '<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>'}let saved=new Set();const stats=document.getElementById('stats'),toolbar=document.getElementById('toolbar'),list=document.getElementById('list'),sideContent=document.getElementById('sideContent');render();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const i=+b.dataset.tab;document.getElementById('heading').textContent=["نظرة عامة","العقارات","العملاء"][i];document.getElementById('listTitle').textContent=["نظرة عامة","العقارات","العملاء"][i];});</script></body></html>
